services:
  edge-fallback:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edge-fallback.rule=Host(`fallback.sundaresan.dev`)"
      - "traefik.http.routers.edge-fallback.entrypoints=websecure"
      - "traefik.http.routers.edge-fallback.tls.certResolver=letsencrypt"
      - "traefik.http.services.edge-fallback.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true
